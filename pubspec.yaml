name: wajbati_dashboard
description: "A new Flutter project for Wajbati Cafeteria"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.1.1
  audioplayers: ^6.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  image_picker: ^1.2.4
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/new_order.wav
    - assets/fonts/OFL.txt
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
